[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-counter"
version = "0.1.0"
description = "Evidence Counter agent for The Context Wrangler pipeline"
requires-python = ">=3.12"
dependencies = ["anthropic>=2.3"]

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
