[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "context-wrangler-aggregator"
version = "0.1.0"
description = "Entry Aggregator agent for The Context Wrangler pipeline"
requires-python = ">=3.12"
dependencies = ["anthropic>=2.3"]

[project.scripts]
context-wrangler-aggregator = "aggregator.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/aggregator"]

